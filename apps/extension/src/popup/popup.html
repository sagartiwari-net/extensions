<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>1Clk Debug</title>
    <style>
      body {
        margin: 0;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        min-width: 380px;
        max-width: 520px;
        padding: 12px;
        background: #0f1419;
        color: #e8eef4;
      }
      #status {
        color: #8b9aab;
        margin-bottom: 8px;
        white-space: pre-wrap;
      }
      strong {
        color: #3d9cf0;
      }
      .hint {
        color: #64748b;
        font-size: 11px;
        margin-bottom: 10px;
      }
      button {
        background: #1e2a38;
        color: #e8eef4;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        margin-right: 6px;
        margin-bottom: 8px;
      }
      button:hover {
        background: #243447;
      }
      button.primary {
        background: #0e4d7a;
        border-color: #1d6fa5;
      }
      #logs {
        max-height: 360px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        background: #0a0e12;
        border: 1px solid #1e293b;
        border-radius: 6px;
        padding: 8px;
        color: #a5f3fc;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <div><strong id="title">1Clk</strong></div>
    <div id="status">Checking…</div>
    <div class="hint">
      Production security on. Debug build: SW inspect kill is OFF. Use Save log file — no service
      worker console needed.
    </div>
    <div>
      <button type="button" class="primary" id="btnSave">Save log file</button>
      <button type="button" id="btnLogs">Refresh</button>
      <button type="button" id="btnCopy">Copy</button>
      <button type="button" id="btnClear">Clear</button>
    </div>
    <div id="logs">1) Jasper Access chalao 2) yahan Refresh / Save log file</div>
    <script src="./popup.js"></script>
  </body>
</html>
